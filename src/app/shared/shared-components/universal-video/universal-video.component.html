<video *ngIf="isDirectVideoSource && safeVideoUrl"
    width="100%"
    height="100%"
    controls
    playsinline>
    <source [src]="safeVideoUrl" />
</video>

<iframe *ngIf="!isDirectVideoSource && safeEmbedUrl"
    width="100%"
    height="100%"
    [src]="safeEmbedUrl"
    frameborder="0"
    allowfullscreen>
</iframe>
