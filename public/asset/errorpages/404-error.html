<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="errorstyle.css" />
</head>

<body>

    <div class="container">
        <!-- Top Image -->
        <img class="top-img" src="/asset/errorpages/errorassets/Picture1.png" alt="Error Image">

        <!-- Title -->
        <h1 class="title">The page / site that you are looking for is currently unavailable.</h1>

        <!-- Bottom Image -->
        <img class="bottom-img" src="/asset/errorpages/errorassets/Picture2.png" alt="Bottom Image">

        <!-- Home | Close -->
        <div class="actions">
            <a href="/" class="link">Home</a>
            <span class="divider">|</span>
            <a href="javascript:window.close();" class="link">Close</a>
        </div>
    </div>

</body>

</html>
